<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원·파트너 | 한국AI기술협회</title>
  <meta name="description" content="한국AI기술협회 회원·파트너 페이지">
</head>
<body>
  <p style="font-family:sans-serif;padding:2rem">회원·파트너 페이지를 불러오는 중입니다…</p>
  <script type="module">
    const repositoryBase = "/koreaaitech-website";
    const { default: site } = await import(repositoryBase + "/worker/index.js?v=2955cb3");
    const response = await site.fetch(new Request(location.origin + "/membership" + location.search));
    let html = await response.text();
    html = html.replace(/href="\/(?!\/)([^"]*)"/g, (_, target) => {
      const [path, fragment] = target.split("#");
      const cleanPath = path.replace(/^\/+|\/+$/g, "");
      const routePath = cleanPath ? "/" + cleanPath + "/" : "/";
      return 'href="' + repositoryBase + routePath + (fragment ? "#" + fragment : "") + '"';
    });
    document.open();
    document.write(html);
    document.close();
  </script>
</body>
</html>
